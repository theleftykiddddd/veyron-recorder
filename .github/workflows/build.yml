
name: Build Veyron Proyect

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Veyron (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Windows mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v6.0.0-alpha.1
          target: Win64

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Veyron-Proyect-Windows
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Veyron (Android64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Android64 mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v6.0.0-alpha.1
          target: Android64

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: Veyron-Proyect-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 14

