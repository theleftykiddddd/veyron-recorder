
name: Build Veyron Proyect

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Geode mod (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build .geode package
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v6.0.0-alpha.1
          target: Win64

      - name: Upload .geode file
        uses: actions/upload-artifact@v4
        with:
          name: Veyron-Proyect-Windows
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 14
