

name: Build Veyron Proyect

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =========================
  # WINDOWS BUILD
  # =========================
  build-windows:
    name: Build Veyron (Windows)
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Build Windows mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v6.0.0-alpha.1
          target: Win64

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Veyron-Proyect-Windows
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 14

  # =========================
  # ANDROID BUILD
  # =========================
  build-android:
    name: Build Veyron (Android64)
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare Android version
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("mod.json")
          data = json.loads(path.read_text())

          data["geode"] = "5.0.0-alpha.1"

          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Build Android64 mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.0.0-alpha.1
          target: Android64

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: Veyron-Proyect-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 14
